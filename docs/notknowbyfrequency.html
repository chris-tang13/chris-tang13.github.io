<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按频次展示生词</title>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/pinyin-pro@3.18.2/dist/index.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        .container,
        .content-container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 5rem;
            margin-bottom: 30px;
        }

        .pinyin {
            font-size: 6rem;
            margin: 1rem 0;
            min-height: 3rem;
        }

        .hanzi {
            font-size: 6rem;
            margin: 1rem 0;
            min-height: 3rem;
            display: none;
        }

        button {
            padding: 0.5rem 1rem;
            margin: 0.5rem;
            font-size: 2rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .frequency {
            font-size: 2rem;
            color: #666;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div id="counter"
        style="position: fixed;bottom:0;right: 10px;width: 100px;height: 100px;border-radius: 50px;background-color: #d41f1f;display: flex;justify-content: center;align-items: center;color:white;font-size: 1.5rem;">
    </div>
    <nav
        style="position: fixed; top: 0; left: 0; width: 100%; background: #333; color: white; padding: 1rem; z-index: 1000; display: flex; justify-content: center; gap: 2rem;">
        <a href="index.html" style="color: white; text-decoration: none; font-size: 1.5rem;">首页</a>
        <a href="notknow.html" style="color: white; text-decoration: none; font-size: 1.5rem;">错词集合</a>
        <a href="pinyinhanzi.html" style="color: white; text-decoration: none; font-size: 1.5rem;">看拼音写字</a>
        <a href="addword.html" style="color: white; text-decoration: none; font-size: 1.5rem;">添加生词</a>
        <a href="notknowbyfrequency.html" style="color: white; text-decoration: none; font-size: 1.5rem;">按频次展示</a>
    </nav>

    <div class="content-container" style="margin-top: 5rem;">
        <h1>按频次展示生词</h1>
        <div class="pinyin" id="pinyin"></div>
        <div class="hanzi" id="hanzi"></div>
        <div class="frequency" id="frequency"></div>
        <button id="nextBtn">下一个</button>
        <button id="showHanziBtn">显示汉字</button>
        <button id="notKnow">不会</button>
    </div>

    <script>
        const {
            createClient
        } = supabase;
        const supabaseClient = createClient('https://nrkepcamdijtioxltaqr.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ya2VwY2FtZGlqdGlveGx0YXFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzk5NTkxODQsImV4cCI6MjA1NTUzNTE4NH0.pEdq389YURpn-UI3P3BmEQ8ttqUoi6-m5xs6ZJeJps0'
        );

        // 拼音库
        const { pinyin } = pinyinPro;

        let words = [];
        let currentIndex = -1;
        let counter = 0;
        const counterElement = document.getElementById('counter');

        // 从Supabase获取按频次排序的单词
        async function fetchWordsByFrequency() {
            counterElement.textContent = counter;
            try {
                // const { data, error } = await supabaseClient
                //     .from('remember_words_activity_records')
                //     .select('grouped_word, word_count')
                //     .order('word_count', { ascending: false });

                const { data, error } = await supabaseClient
                    .rpc('get_grouped_word_data');

                if (error) throw error;

                words = data;
                console.log(words);
                if (words.length > 0) {
                    showNextWord();
                } else {
                    document.getElementById('pinyin').textContent = '没有找到生词记录';
                }
            } catch (err) {
                console.log('获取单词失败:', err);
                document.getElementById('pinyin').textContent = '获取单词失败';
            }
        }

        // 显示下一个单词
        function showNextWord() {
            if (words.length === 0) return;

            currentIndex++;

            if (currentIndex >= words.length) {
                document.getElementById('pinyin').textContent = '所有单词已展示完毕';
                document.getElementById('hanzi').style.display = 'none';
                document.getElementById('frequency').textContent = '';
                return;
            }

            const wordObj = words[currentIndex];
            document.getElementById('pinyin').textContent = pinyin(wordObj.grouped_word);
            document.getElementById('hanzi').textContent = wordObj.grouped_word;
            document.getElementById('hanzi').style.display = 'none';
            document.getElementById('frequency').textContent = `出现次数: ${wordObj.word_count}`;

            //更新计数器
            counter++;
            counterElement.textContent = counter;
            const utterance = new SpeechSynthesisUtterance(`第${counter}个生词`);
            utterance.lang = 'zh-CN';
            speechSynthesis.speak(utterance);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', fetchWordsByFrequency);

        // 下一个按钮事件
        document.getElementById('nextBtn').addEventListener('click', showNextWord);

        // 显示汉字按钮事件
        document.getElementById('showHanziBtn').addEventListener('click', () => {
            const hanziElement = document.getElementById('hanzi');
            hanziElement.style.display = hanziElement.style.display === 'none' ? 'block' : 'none';
        });

        // 不会按钮事件
        document.getElementById('notKnow').addEventListener('click', async () => {
            try {
                const wordObj = words[currentIndex];
                const { error } = await supabaseClient
                .from('remember_words_activity_records')
                    .insert([{ word: wordObj.grouped_word }]);
                
                    

                if (error) throw error;
                alert('已更新记忆记录');
            } catch (err) {
                console.log('更新失败:', err);
                alert('更新失败');
            }
        });
    </script>
</body>

</html>
