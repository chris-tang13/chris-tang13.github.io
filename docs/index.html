<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孩子的不认识单词集</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .word-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        
        .word-box {
            border: 2px solid #4a90e2;
            border-radius: 8px;
            padding: 10px 15px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 18px;
            color: #333;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .word-box:hover {
            background-color: #e6f0fa;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }
        
        button {
            padding: 8px 15px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #3a7bc8;
        }
        
        .search-box {
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 200px;
        }
        
        .loading {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>孩子不认识单词集</h1>
    
    <div class="controls">
        <input type="text" class="search-box" placeholder="搜索单词...">
        <button id="sortBtn">按字母排序</button>
        <button id="shuffleBtn">随机排序</button>
    </div>
    
    <div class="word-container" id="wordContainer">
        <div class="loading">正在加载单词...</div>
    </div>
    
    <script>
      
        document.addEventListener('DOMContentLoaded', function() {
            const wordContainer = document.getElementById('wordContainer');
            const sortBtn = document.getElementById('sortBtn');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const searchBox = document.querySelector('.search-box');
          
            
            // 存储单词的数组
            let words = [];

          
            
            // 渲染单词到页面
            function renderWords(wordList) {
                if (wordList.length === 0) {
                    wordContainer.innerHTML = '<div class="loading">没有找到单词</div>';
                    return;
                }
                
                wordContainer.innerHTML = '';
                wordList.forEach(word => {
                    const wordBox = document.createElement('div');
                    wordBox.className = 'word-box';
                    wordBox.textContent = word;
                    
                    // 点击单词可以标记为已认识（可选功能）
                    wordBox.addEventListener('click', function() {
                        this.style.opacity = '0.5';
                        this.style.textDecoration = 'line-through';
                        // 这里可以添加API调用将单词标记为已认识
                    });
                    
                    wordContainer.appendChild(wordBox);
                });

            // 按字母排序
            sortBtn.addEventListener('click', function() {
                const sortedWords = [...words].sort((a, b) => a.localeCompare(b));
                renderWords(sortedWords);
            });
            
            // 随机排序
            shuffleBtn.addEventListener('click', function() {
                const shuffledWords = [...words].sort(() => Math.random() - 0.5);
                renderWords(shuffledWords);
            });
            
            // 搜索功能
            searchBox.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                const filteredWords = words.filter(word => 
                    word.toLowerCase().includes(searchTerm)
                );
                renderWords(filteredWords);
            });
            
            // 初始化页面
            fetchWords();

</body>
