<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孩子的不认识单词集</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        .word-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .word-box {
            border: 2px solid #4a90e2;
            border-radius: 8px;
            padding: 10px 15px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            font-size: 18px;
            color: #333;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .word-box:hover {
            background-color: #e6f0fa;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        button {
            padding: 8px 15px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3a7bc8;
        }

        .search-box {
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 200px;
        }

        .loading {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <h1>孩子不认识单词集</h1>

    <div class="controls">
        <input type="text" class="search-box" placeholder="搜索单词...">
        <button id="sortBtn">按字母排序</button>
        <button id="shuffleBtn">随机排序</button>
    </div>

    <div class="word-container" id="wordContainer">
        <div class="loading">正在加载单词...</div>
    </div>

    <script>
        const {
            createClient
        } = supabase;
        const supabaseClient = createClient('https://nrkepcamdijtioxltaqr.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ya2VwY2FtZGlqdGlveGx0YXFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzk5NTkxODQsImV4cCI6MjA1NTUzNTE4NH0.pEdq389YURpn-UI3P3BmEQ8ttqUoi6-m5xs6ZJeJps0'
        );
        async function addRememberedWord(item) {
            const { data, error } = await supabaseClient
                .from('remember_words_activity_records')
                .insert([
                    { word: item },
                ])
                .select();


            if (error) {
                console.error('Error:', error);
            } else {
                console.log('record  added:', data);

            }

        }

        document.addEventListener('DOMContentLoaded', function () {
            const wordContainer = document.getElementById('wordContainer');
            const sortBtn = document.getElementById('sortBtn');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const searchBox = document.querySelector('.search-box');


            // 存储单词的数组
            let words = [];
            // 存储今天已读单词的数组
            let todayReadWords = [];
            //查询今天已经读的单词
            async function fetchTodayReadWords() {
                const today = new Date();
                today.setHours(0, 0, 0, 0); // 设置为今天0点
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1); // 明天0点

                const { data, error } = await supabaseClient
                    .from('remember_words_activity_records')
                    .select('word')
                    .gte('read_time', today.toISOString()) // 大于等于今天0点
                    .lt('read_time', tomorrow.toISOString()); // 小于明天0点

                if (error) {
                    console.error('Error:', error);
                    return [];
                }
                todayReadWords = data.map(item => item.word); // 返回单词数组
            }



            // 渲染单词到页面
            function renderWords(wordList) {
                if (wordList.length === 0) {
                    wordContainer.innerHTML = '<div class="loading">没有找到单词</div>';
                    return;
                }

                wordContainer.innerHTML = '';
                wordList.forEach(word => {
                    const wordBox = document.createElement('div');
                    wordBox.className = 'word-box';
                    wordBox.textContent = word;

                    // 如果是今天已读的单词，添加删除线样式
                    if (todayReadWords.includes(word)) {
                        wordBox.style.textDecoration = 'line-through';
                        wordBox.style.opacity = '0.5';
                    }

                    // 点击单词可以标记为已认识（可选功能）
                    wordBox.addEventListener('click', function () {
                        this.style.opacity = '0.5';
                        this.style.textDecoration = 'line-through';
                        // 这里可以添加API调用将单词标记为已认识
                        addRememberedWord(word);
                    });

                    wordContainer.appendChild(wordBox);
                });
            }

            // 模拟从API获取数据 - 实际使用时替换为真实的API调用



            async function fetchWords() {
                const {
                    data,
                    error
                } = await supabaseClient
                    .from('unknown_words')
                    .select();

                if (error) {
                    console.error('Error:', error);
                } else {
                    console.log('Data:', data);
                    data.forEach(item => {
                        words.push(item.word);
                    })
                    renderWords(words); // 调用渲染函数
                    // updateProgress(data); // 更新进度条
                }
            }




            // 按字母排序
            sortBtn.addEventListener('click', function () {
                const sortedWords = [...words].sort((a, b) => a.localeCompare(b));
                renderWords(sortedWords);
            });

            // 随机排序
            shuffleBtn.addEventListener('click', function () {
                const shuffledWords = [...words].sort(() => Math.random() - 0.5);
                renderWords(shuffledWords);
            });

            // 搜索功能
            searchBox.addEventListener('input', function () {
                const searchTerm = this.value.toLowerCase();
                const filteredWords = words.filter(word =>
                    word.toLowerCase().includes(searchTerm)
                );
                renderWords(filteredWords);
            });

            // 初始化页面
            fetchTodayReadWords();
            fetchWords();
        });
    </script>
</body>

</html>
